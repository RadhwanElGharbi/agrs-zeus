# PIRL Project Configuration Template
# Generated by ZEUS AGRS for <PROJECT_NAME>
# 
# INSTRUCTIONS:
# This is a template file. Replace all <PLACEHOLDER> values with actual project data.
# The GUI workflow should automatically populate most values.

# ============================================================================
# PROJECT IDENTIFICATION
# ============================================================================

project:
  name: <PROJECT_NAME>
  code: <PROJECT_CODE>              # Example: PROJ_ITALY_V1
  client: <CLIENT_NAME>             # Example: SAIPEM, ENI, etc.
  crs_epsg: <EPSG_CODE>             # Example: 32633 (WGS84 UTM 33N)
  measurement_units: SI             # Always SI (meters, bar, kg, etc.)

# Legacy format (for compatibility with older code)
project_name: <PROJECT_NAME>
project_code: <PROJECT_CODE>
client_name: <CLIENT_NAME>
epsg_code: <EPSG_CODE>
measurement_units: SI

# ============================================================================
# ROUTE ENDPOINTS (UTM coordinates in project CRS)
# ============================================================================

# Start Point (converted from lat/lon by GUI)
start_x: <START_X>                  # UTM easting (meters)
start_y: <START_Y>                  # UTM northing (meters)

# End Point (converted from lat/lon by GUI)
end_x: <END_X>                      # UTM easting (meters)
end_y: <END_Y>                      # UTM northing (meters)

# ============================================================================
# AOI BOUNDS (extracted from AOI file)
# ============================================================================

aoi_bbox:
  min_x: <AOI_MIN_X>                # Minimum easting
  min_y: <AOI_MIN_Y>                # Minimum northing
  max_x: <AOI_MAX_X>                # Maximum easting
  max_y: <AOI_MAX_Y>                # Maximum northing

# ============================================================================
# COST WEIGHTS (Enhanced - includes hydraulics and regulatory)
# ============================================================================

cost_weights:
  terrain_difficulty: 0.20          # Reduced to accommodate new factors
  water_crossings: 0.15             # Rivers, streams, wetlands
  infrastructure_crossings: 0.10    # Roads, railways, power lines
  environmental_impact: 0.12        # Protected areas, sensitive habitats
  row_acquisition: 0.08             # Right-of-way land costs
  permitting_complexity: 0.08       # Regulatory compliance costs
  hydraulic_costs: 0.12             # NEW - Compressor stations, flow optimization
  regulatory_penalties: 0.15        # NEW - Code violations, constraint breaches

# ============================================================================
# HYDRAULICS CONFIGURATION
# ============================================================================

hydraulics:
  flow_rate_m3_s: 1.0               # Volumetric flow rate (m³/s)
  fluid_type: "natural_gas"         # Options: natural_gas, oil, water, h2, co2, ngl
  temperature_k: 288.15             # Operating temperature (15°C)
  enable_pumping_stations: true     # Allow automatic compressor placement
  max_pressure_drop_mpa: 5.0        # Max pressure drop before compressor required

# ============================================================================
# REGULATORY COMPLIANCE CONFIGURATION
# ============================================================================

regulatory:
  country_code: "<COUNTRY_CODE>"    # ISO 3166-1 alpha-3 (e.g., ITA, USA, SAU)
  region: "<REGION_NAME>"           # State/province for region-specific rules
  enable_cost_penalties: true       # Apply regulatory violation costs
  load_from_docs: true              # Load thresholds from regulatory_docs/

# ============================================================================
# CONSTRAINTS
# ============================================================================

constraints:
  max_slope_percent: 20             # Maximum allowable slope (SAIPEM: 20%, Industry: 30%)
  max_curvature_rad_per_m: 0.01     # Maximum curvature for bends
  min_crossing_angle_deg: 75        # Minimum angle for infrastructure crossings
  buffer_protected_areas_m: 100     # Minimum distance from protected areas
  buffer_water_bodies_m: 50         # Minimum distance from water bodies
  max_segment_length_m: 100         # Maximum step size per action
  allowed_hot_bend_angles_deg: [15, 30, 45, 60, 90]  # Standard hot bend angles

# Legacy format (for compatibility)
max_slope_percent: 20
max_curvature_rad_per_m: 0.01
min_crossing_angle_deg: 75
buffer_protected_areas_m: 100
buffer_water_bodies_m: 50
max_segment_length_m: 100
allowed_hot_bend_angles_deg: [15, 30, 45, 60, 90]

# ============================================================================
# TRAINING CONFIGURATION (Conservative Defaults)
# ============================================================================

training:
  total_timesteps: 500000           # 500k timesteps (~5-10k episodes)
  num_envs: 8                       # Parallel training environments
  eval_freq: 10000                  # Evaluate model every 10k steps
  save_freq: 50000                  # Save checkpoint every 50k steps
  max_steps_per_episode: 5000       # Maximum steps before episode truncation
  learning_rate: 0.0003             # Adam optimizer learning rate
  batch_size: 256                   # Minibatch size for gradient updates
  algorithm: PPO                    # Proximal Policy Optimization
  
  # PPO-specific parameters
  n_steps: 2048                     # Steps per rollout buffer
  gamma: 0.99                       # Discount factor for future rewards
  gae_lambda: 0.95                  # GAE (Generalized Advantage Estimation) parameter
  clip_range: 0.2                   # PPO clipping range
  ent_coef: 0.01                    # Entropy coefficient (exploration bonus)
  vf_coef: 0.5                      # Value function coefficient
  max_grad_norm: 0.5                # Gradient clipping threshold

# Legacy format (for compatibility)
total_timesteps: 500000
num_envs: 8
eval_freq: 10000
save_freq: 50000
max_steps_per_episode: 5000
learning_rate: 0.0003
batch_size: 256
algorithm: PPO
n_steps: 2048
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# ============================================================================
# FILE PATHS (Auto-generated based on project directory)
# ============================================================================

project_dir: <PROJECT_PATH>
data_dir: <PROJECT_PATH>/data
output_dir: <PROJECT_PATH>/PIRL/outputs/pirl_training
tensorboard_log: <PROJECT_PATH>/PIRL/outputs/pirl_training/tensorboard
model_save_path: <PROJECT_PATH>/PIRL/models/<PROJECT_NAME_LOWER>_v1

# ============================================================================
# NOTES
# ============================================================================

# After creating this file from template:
# 1. Verify all <PLACEHOLDER> values have been replaced
# 2. Adjust training parameters if needed (more timesteps for production)
# 3. Customize cost weights based on project priorities
# 4. Update regulatory section with correct country/region
# 5. Load pipeline_specs.json for detailed pipeline parameters
# 6. Use parameter tuner (PIRL/pirl_parameter_tuner) for fine-tuning

# For production training runs:
# - Increase total_timesteps to 1-2 million
# - Increase num_envs if you have more CPU cores available
# - Monitor tensorboard logs for convergence
# - Save best model based on evaluation metrics





