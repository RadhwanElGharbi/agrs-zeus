# ============================================================================
# NOTES
# ============================================================================

# 1. Keep total_timesteps low during hyperopt for faster iteration
# 2. Use log scale for learning_rate as it spans several orders of magnitude
# 3. For categorical parameters, provide meaningful choices
# 4. Consider using fewer trials with more timesteps vs more trials with fewer timesteps
# 5. Monitor optimization progress with Optuna dashboard: optuna-dashboard sqlite:///hyperopt.db


