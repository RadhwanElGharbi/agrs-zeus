# Paths - PRODUCTION OUTPUT DIRECTORIES
project_dir: /opt/agrs/Projects/test_project2
data_dir: /opt/agrs/Projects/test_project2/data
output_dir: /opt/agrs/Projects/test_project2/PIRL/outputs/production_2M
tensorboard_log: /opt/agrs/Projects/test_project2/PIRL/outputs/production_2M/tensorboard
model_save_path: /opt/agrs/Projects/test_project2/PIRL/models/pirl_italy_production_2M

# Metrics Tracking Configuration
# Track comprehensive metrics for all dimensions during training
metrics:
  enable_detailed_tracking: true
  log_frequency_steps: 1000  # Log detailed metrics every 1000 steps
  
  # Terrain/Geometry metrics
  track_elevation: true
  track_slope: true
  track_curvature: true
  track_aspect: true
  
  # Cost breakdown metrics
  track_terrain_cost: true
  track_water_crossing_cost: true
  track_infrastructure_cost: true
  track_environmental_cost: true
  track_row_cost: true
  track_permitting_cost: true
  track_hydraulic_cost: true
  track_regulatory_cost: true
  
  # Constraint violation metrics
  track_slope_violations: true
  track_clearance_violations: true
  track_railway_approaches: true
  track_protected_area_crossings: true
  track_geohazard_exposure: true
  
  # Physics metrics (if hydraulics enabled)
  track_pressure_drop: true
  track_flow_velocity: true
  track_reynolds_number: true
  track_pumping_stations: true
  
  # Infrastructure proximity metrics
  track_water_proximity: true
  track_road_proximity: true
  track_railway_proximity: true
  track_powerline_proximity: true
  track_pipeline_proximity: true
  
  # Environmental metrics
  track_land_cover_distribution: true
  track_geohazard_risk: true
  track_soil_capacity: true
  track_population_density: true
  
  # Route quality metrics
  track_route_length: true
  track_route_tortuosity: true  # Ratio of route length to straight-line distance
  track_segment_continuity: true
  track_goal_distance_progress: true
  
  # Training performance metrics
  track_episode_length: true
  track_episode_reward: true
  track_success_rate: true
  track_termination_reasons: true


