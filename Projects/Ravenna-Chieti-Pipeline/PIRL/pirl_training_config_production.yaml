# PIRL Project Configuration - PRODUCTION RUN
# 2M timestep production training with full AI Routing Criteria compliance
# Generated by ZEUS AGRS for test_project2

# Project Section
project:
  name: test_project2_production
  code: TP2_ITALY_PROD_2M
  client: SAIPEM
  crs_epsg: 32633
  measurement_units: SI
  pipeline_specs_path: "../pipeline_specs.json"

# Legacy format (for compatibility)
project_name: test_project2_production
project_code: TP2_ITALY_PROD_2M
client_name: SAIPEM
epsg_code: 32633
measurement_units: SI

# Start and End Points (UTM 33N coordinates)
# Start: 43.388493°N, 13.514053°E
start_x: 379647.98
start_y: 4805029.95
# End: 42.900920°N, 13.877318°E
end_x: 408344.71
end_y: 4750423.54

# AOI Bounds (UTM 33N)
aoi_bbox:
  min_x: 362000
  min_y: 4745000
  max_x: 425000
  max_y: 4815000

# Cost Weights (Enhanced - includes hydraulics and regulatory)
# NOTE: Crossing penalties removed (Criteria 1) - cost optimization handles this naturally
cost_weights:
  terrain_difficulty: 0.25      # Increased (from 0.20) - compensate for removed crossing penalty
  water_crossings: 0.18          # Increased (from 0.15) - water crossing costs drive avoidance
  infrastructure_crossings: 0.12 # Increased (from 0.10) - crossing costs drive minimization
  environmental_impact: 0.12     # Maintained
  row_acquisition: 0.08          # Maintained
  permitting_complexity: 0.08    # Maintained
  hydraulic_costs: 0.12          # NEW - pumping stations, flow optimization
  regulatory_penalties: 0.05     # Reduced - focus on cost, not arbitrary penalties

# Hydraulics Configuration
hydraulics:
  flow_rate_m3_s: 0.5            # Volumetric flow rate for 26" gas pipeline
  fluid_type: "natural_gas"      # Gas, Oil, Water, H2, CO2, NGL
  temperature_k: 288.15          # 15°C operating temperature
  enable_pumping_stations: true  # Allow automatic pumping station placement
  max_pressure_drop_mpa: 5.0     # Maximum pressure drop before pump required

# Regulatory Compliance Configuration
regulatory:
  country_code: "ITA"            # Italy
  region: "Marche-Umbria"        # Specific region for threshold loading
  enable_cost_penalties: true    # Apply regulatory violation costs
  load_from_docs: true           # Load thresholds from regulatory_docs/

# Constraints Section
# These are HARD constraints enforced during training
constraints:
  max_slope_percent: 20  # AI Routing Criteria 2 - STRICT 20% limit
  max_curvature_rad_per_m: 0.01
  min_crossing_angle_deg: 75  # AI Routing Criteria 5 - prefer orthogonal
  buffer_protected_areas_m: 100
  buffer_water_bodies_m: 50
  max_segment_length_m: 100
  allowed_hot_bend_angles_deg: [5, 10, 22.5, 45, 90]  # From pipeline_specs.json
  
  # Clearance constraints (from AI Routing Criteria)
  min_powerline_clearance_m: 6.0      # Criteria: 6m for overhead lines AND poles
  min_house_clearance_m: 13.5         # Criteria: 13.5m minimum (updated from 15m)
  min_pipeline_clearance_m: 0.5       # Criteria: 0.5m from existing pipelines (ROW)
  
  # Railway crossing constraint
  railway_crossing_method: "trenchless"  # Criteria 12 - MANDATORY trenchless (HDD)

# Legacy format (for compatibility)
max_slope_percent: 20
max_curvature_rad_per_m: 0.01
min_crossing_angle_deg: 75
buffer_protected_areas_m: 100
buffer_water_bodies_m: 50
max_segment_length_m: 100
allowed_hot_bend_angles_deg: [5, 10, 22.5, 45, 90]

# Training Section - PRODUCTION RUN (1.5M timesteps)
training:
  total_timesteps: 1500000  # 1.5M - production scale (30x more than 50k validation)
  num_envs: 8  # Full parallel environments for production
  eval_freq: 50000  # Evaluate 40 times during training
  save_freq: 100000  # Save 20 checkpoints
  max_steps_per_episode: 5000
  learning_rate: 0.0003
  batch_size: 256  # Full batch size for production
  algorithm: PPO  # Proximal Policy Optimization
  # PPO-specific parameters
  n_steps: 2048  # Full rollout buffer for production
  gamma: 0.99  # Discount factor
  gae_lambda: 0.95  # GAE parameter
  clip_range: 0.2  # PPO clip range
  ent_coef: 0.01  # Entropy coefficient
  vf_coef: 0.5  # Value function coefficient
  max_grad_norm: 0.5  # Gradient clipping

# Legacy format (for compatibility)
