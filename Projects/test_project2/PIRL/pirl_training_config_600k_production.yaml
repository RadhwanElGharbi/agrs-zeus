# PIRL Project Configuration - 600K PRODUCTION RUN
# Matches the reference training that produced route_600k_current.geojson
# This will produce a properly trained model with quality routes

# Project Section
project:
  name: test_project2_600k_production
  code: TP2_ITALY_600K_PROD
  client: SAIPEM
  crs_epsg: 32633
  measurement_units: SI
  pipeline_specs_path: "../pipeline_specs.json"

# Environment configuration for training
env_configs:
  - /opt/agrs/Projects/test_project2/PIRL/pirl_training_config_600k_production.yaml

# Legacy format (for compatibility)
project_name: test_project2_600k_production
project_code: TP2_ITALY_600K_PROD
client_name: SAIPEM
epsg_code: 32633
measurement_units: SI

# Start and End Points (UTM 33N coordinates)
# Start: 43.388493°N, 13.514053°E
start_x: 379647.98
start_y: 4805029.95
# End: 42.898254°N, 13.877811°E
end_x: 408381.01
end_y: 4750126.95

# AOI Bounds (UTM 33N)
aoi_bbox:
  min_x: 362000
  min_y: 4745000
  max_x: 425000
  max_y: 4815000

# Cost Weights (Production - matches reference training)
cost_weights:
  terrain_difficulty: 0.25
  water_crossings: 0.18
  infrastructure_crossings: 0.12
  environmental_impact: 0.12
  row_acquisition: 0.08
  permitting_complexity: 0.08
  hydraulic_costs: 0.12
  regulatory_penalties: 0.05

# Hydraulics Configuration
hydraulics:
  flow_rate_m3_s: 0.5
  fluid_type: "natural_gas"
  temperature_k: 288.15
  enable_pumping_stations: true
  max_pressure_drop_mpa: 5.0

# Regulatory Compliance Configuration
regulatory:
  country_code: "ITA"
  region: "Marche-Umbria"
  enable_cost_penalties: true
  load_from_docs: true

# Constraints Section - HARD constraints
constraints:
  max_slope_percent: 20  # STRICT 20% limit
  max_curvature_rad_per_m: 0.01
  min_crossing_angle_deg: 75
  buffer_protected_areas_m: 100
  buffer_water_bodies_m: 50
  max_segment_length_m: 100
  allowed_hot_bend_angles_deg: [15, 30, 45, 60, 90]  # Pre-fabricated hot bends from pipeline_specs.json
  
  # Clearance constraints
  min_powerline_clearance_m: 6.0
  min_house_clearance_m: 13.5
  min_pipeline_clearance_m: 0.5
  
  # Railway crossing constraint
  railway_crossing_method: "trenchless"

# Legacy format (for compatibility)
max_slope_percent: 20
max_curvature_rad_per_m: 0.01
min_crossing_angle_deg: 75
buffer_protected_areas_m: 100  # Informational only - actual avoidance via GIS no-go zones
buffer_water_bodies_m: 50      # Informational only - actual handling via proximity penalties
max_segment_length_m: 100
allowed_hot_bend_angles_deg: [15, 30, 45, 60, 90]  # From pipeline_specs.json

# Training Section - 600K PRODUCTION RUN
# Matches the configuration that produced route_600k_current.geojson
training:
  total_timesteps: 600000  # 600K - proper production training
  num_envs: 24  # 24 parallel environments
  eval_freq: 5000  # Evaluate every 5K timesteps (120 evaluations)
  save_freq: 10000  # Save every 10K timesteps (60 checkpoints)
  max_steps_per_episode: 5000
  learning_rate: 0.0003
  batch_size: 256
  algorithm: PPO
  # PPO-specific parameters
  n_steps: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Legacy format (for compatibility)
total_timesteps: 600000
num_envs: 24
eval_freq: 5000
save_freq: 10000
max_steps_per_episode: 5000
learning_rate: 0.0003
batch_size: 256
algorithm: PPO
n_steps: 2048
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

# Paths - 600K PRODUCTION OUTPUT DIRECTORIES
project_dir: /opt/agrs/Projects/test_project2
data_dir: /opt/agrs/Projects/test_project2/data
output_dir: /opt/agrs/Projects/test_project2/PIRL/outputs/production_600k
tensorboard_log: /opt/agrs/Projects/test_project2/PIRL/outputs/production_600k/tensorboard
model_save_path: /opt/agrs/Projects/test_project2/PIRL/models/pirl_600k_production

# Metrics Tracking Configuration
metrics:
  enable_detailed_tracking: true
  log_frequency_steps: 500
  
  # Terrain/Geometry metrics
  track_elevation: true
  track_slope: true
  track_curvature: true
  track_aspect: true
  
  # Cost breakdown metrics
  track_terrain_cost: true
  track_water_crossing_cost: true
  track_infrastructure_cost: true
  track_environmental_cost: true
  track_row_cost: true
  track_permitting_cost: true
  track_hydraulic_cost: true
  track_regulatory_cost: true
  
  # Constraint violation metrics
  track_slope_violations: true
  track_clearance_violations: true
  track_railway_approaches: true
  track_protected_area_crossings: true
  track_geohazard_exposure: true
  
  # Physics metrics
  track_pressure_drop: true
  track_flow_velocity: true
  track_reynolds_number: true
  track_pumping_stations: true
  
  # Infrastructure proximity metrics
  track_water_proximity: true
  track_road_proximity: true
  track_railway_proximity: true
  track_powerline_proximity: true
  track_pipeline_proximity: true
  
  # Environmental metrics
  track_land_cover_distribution: true
  track_geohazard_risk: true
  track_soil_capacity: true
  track_population_density: true
  
  # Route quality metrics
  track_route_length: true
  track_route_tortuosity: true
  track_segment_continuity: true
  track_goal_distance_progress: true
  
  # Training performance metrics
  track_episode_length: true
  track_episode_reward: true
  track_success_rate: true
  track_termination_reasons: true

