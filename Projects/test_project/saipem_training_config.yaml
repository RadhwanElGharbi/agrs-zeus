# SAIPEM PIRL Training Configuration
# Complete Solution for Industry-Standard Cost-Optimal Pipeline Routing
# Generated: 2025-10-26

# ============================================================================
# PROJECT IDENTIFICATION
# ============================================================================
project_name: SAIPEM_Italy_Route_Optimization
project_code: SAIPEM_IT_001
client_name: SAIPEM
region: Central Italy (Lazio/Abruzzo)

# ============================================================================
# COORDINATE SYSTEM
# ============================================================================
epsg_code: 32633  # UTM Zone 33N (Italy)
measurement_units: SI  # Meters, kilograms, etc.

# ============================================================================
# START AND END POINTS (UTM 33N)
# ============================================================================
# From test_project config: 54.9km route
start_x: 379647.98
start_y: 4805029.95
end_x: 408381.01
end_y: 4750126.95

# ============================================================================
# SAIPEM PIPELINE SPECIFICATIONS
# ============================================================================
pipeline:
  type: Natural Gas
  material: Carbon Steel
  diameter_inches: 26
  diameter_mm: 660
  thickness_mm: 11.1
  mop_bar: 70
  design_pressure_bar: 75
  depth_of_cover_m: 1.5
  
  # Hot bends available (SAIPEM specific)
  hot_bend_angles_deg: [15, 30, 45, 60, 90]
  max_hdd_bending_deg: 12
  
  # Clearance requirements (SAIPEM specific)
  clearance_power_lines_m: 6.0
  clearance_power_poles_m: 6.0
  clearance_houses_m: 13.5
  clearance_existing_pipelines_m: 0.5

# ============================================================================
# SAIPEM'S 12 ROUTING CRITERIA (Priority Order)
# ============================================================================
saipem_criteria:
  # Priority 1: Minimize number of crossings (VERY HIGH cost impact)
  - id: 1
    name: "Minimize crossings"
    priority: VERY_HIGH
    weight: 3.0
    description: "Each crossing = major cost"
    
  # Priority 2: Minimize steep slope areas (VERY HIGH cost impact)  
  - id: 2
    name: "Avoid slopes >20%"
    priority: VERY_HIGH
    weight: 3.0
    max_slope_percent: 20
    description: "Exponential excavation cost increase"
    
  # Priority 3: Minimize protected area crossings (VERY HIGH cost impact)
  - id: 3
    name: "Avoid protected areas"
    priority: VERY_HIGH
    weight: 3.0
    description: "Often impossible or extremely expensive"
    
  # Priority 4: Minimize high risk geohazard areas (HIGH cost impact)
  - id: 4
    name: "Avoid geohazard zones"
    priority: HIGH
    weight: 2.0
    description: "Engineering requirements increase cost"
    
  # Priority 5: Prefer orthogonal crossing angles (MEDIUM cost impact)
  - id: 5
    name: "90° crossings preferred"
    priority: MEDIUM
    weight: 0.5
    target_angle_deg: 90
    min_angle_deg: 75
    description: "Minimize crossing length and cost"
    
  # Priority 6: Prefer parallelism with existing pipelines (MEDIUM cost impact)
  - id: 6
    name: "Parallel to existing pipes"
    priority: MEDIUM
    weight: 0.3
    description: "Shared ROW reduces land acquisition"
    
  # Priority 7: Maintain minimum clearances (HARD CONSTRAINT)
  - id: 7
    name: "0.5m from existing pipes"
    priority: CRITICAL
    weight: 10.0
    description: "Safety requirement - hard constraint"
    
  # Priority 8: Avoid side slope routes (MEDIUM cost impact)
  - id: 8
    name: "Avoid side slopes"
    priority: MEDIUM
    weight: 1.0
    description: "Specialized construction techniques required"
    
  # Priority 9: Minimize population exposure (REGULATORY)
  - id: 9
    name: "Minimize population exposure"
    priority: MEDIUM
    weight: 0.5
    description: "Safety and regulatory requirement"
    
  # Priority 10: Optimize ROW acquisition (MEDIUM cost impact)
  - id: 10
    name: "Optimize ROW costs"
    priority: MEDIUM
    weight: 1.0
    description: "Land acquisition costs vary by type"
    
  # Priority 11: Meet engineering standards (HARD CONSTRAINTS)
  - id: 11
    name: "Engineering standards"
    priority: CRITICAL
    weight: 10.0
    description: "Industry codes and standards"
    
  # Priority 12: Overall cost optimization (PRIMARY OBJECTIVE)
  - id: 12
    name: "Minimize total cost"
    priority: VERY_HIGH
    weight: 1.0
    description: "Primary objective: 10%+ savings"

# ============================================================================
# CONSTRAINTS (Industry Standards + SAIPEM Specific)
# ============================================================================
constraints:
  # Terrain constraints
  max_slope_percent: 20  # SAIPEM stricter than industry 30%
  max_slope_absolute: 30  # Absolute maximum (hard failure)
  max_curvature_rad_per_m: 0.01
  min_bend_radius_m: 1000  # Cold bending
  
  # Crossing constraints
  min_crossing_angle_deg: 75  # SAIPEM prefers 90°
  target_crossing_angle_deg: 90
  max_crossing_length_m: 500
  
  # Buffer zones
  buffer_protected_areas_m: 100
  buffer_water_bodies_m: 50
  buffer_urban_areas_m: 200
  buffer_geohazard_zones_m: 100
  
  # Segment constraints
  max_segment_length_m: 100  # Step size for training
  min_segment_length_m: 10

# ============================================================================
# TRAINING PARAMETERS (Optimized for CPU, SAIPEM Criteria)
# ============================================================================
training:
  # Total training steps
  total_timesteps: 2000000  # 2M steps for production quality
  
  # Parallel environments
  num_envs: 8  # CPU parallelism
  
  # Evaluation
  eval_freq: 10000  # Evaluate every 10k steps
  n_eval_episodes: 10
  save_freq: 50000  # Save checkpoint every 50k
  
  # Episode parameters
  max_steps_per_episode: 1000  # Reduced from 5000
  episode_timeout_penalty: -50.0
  
  # PPO Hyperparameters (Optimized)
  algorithm: PPO
  learning_rate: 0.0003
  batch_size: 512  # Larger for stability
  n_steps: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01  # Exploration
  vf_coef: 0.5
  max_grad_norm: 0.5
  
  # Curriculum learning stages
  curriculum_stages:
    - name: "Basic Navigation"
      timesteps: 200000
      max_distance_km: 5
      constraints_active: ["slope", "bounds"]
      description: "Learn to reach goal"
      
    - name: "Terrain Adaptation"  
      timesteps: 400000
      max_distance_km: 15
      constraints_active: ["slope", "bounds", "water", "protected"]
      description: "Learn terrain costs"
      
    - name: "Full SAIPEM Criteria"
      timesteps: 1400000
      max_distance_km: 60
      constraints_active: "all"
      description: "Full 12-criterion optimization"

# ============================================================================
# REWARD FUNCTION CONFIGURATION
# ============================================================================
reward:
  # Reward scaling (prevent catastrophic values)
  reward_scale: 0.001  # Divide raw rewards by 1000
  reward_clip_min: -100.0
  reward_clip_max: 100.0
  
  # Component weights (normalized to sum=1.0)
  weights:
    progress: 0.1  # Moving toward goal
    cost: 0.3  # Construction cost
    crossings: 0.15  # SAIPEM Priority 1
    slope: 0.15  # SAIPEM Priority 2
    protected_areas: 0.1  # SAIPEM Priority 3
    geohazards: 0.05  # SAIPEM Priority 4
    orthogonality: 0.02  # SAIPEM Priority 5
    parallelism: 0.01  # SAIPEM Priority 6
    clearances: 0.05  # SAIPEM Priority 7
    population: 0.02  # SAIPEM Priority 9
    curvature: 0.03  # Smoothness
    goal_bonus: 0.02  # Completion
  
  # Goal reached bonus
  goal_threshold_m: 50
  goal_bonus: 1000.0
  
  # Step penalty (encourage efficiency)
  step_penalty: 0.1

# ============================================================================
# COST MATRIX (From Research)
# ============================================================================
costs:
  # Regional multiplier
  regional_multiplier: 1.0  # Italy baseline
  
  # Terrain difficulty multipliers
  terrain:
    flat_0_2deg: 1.0
    gentle_2_5deg: 1.15
    gentle_5_10deg: 1.35
    moderate_10_15deg: 1.5
    moderate_15_20deg: 1.75
    steep_20_30deg: 2.0
    very_steep_30_40deg: 2.5
    extreme_40plus: 10.0  # Penalty
  
  # Land cover cost multipliers
  landcover:
    tree_cover: 1.8
    shrubland: 1.5
    grassland: 1.1
    cropland: 1.5
    wetland: 3.0
    bare_ground: 1.0
    urban: 8.0
    water: 4.0
  
  # Crossing costs (USD per meter)
  crossings:
    stream_small_open: 500
    stream_small_hdd: 1500
    river_medium_open: 2000
    river_medium_hdd: 6000
    river_large_open: 5000
    river_large_hdd: 20000
    road_unpaved: 500
    road_tertiary: 1500
    road_secondary: 3000
    road_primary: 6000
    road_motorway: 15000
    railway: 4500
    power_low: 1000
    power_high: 3000

# ============================================================================
# PATHS
# ============================================================================
paths:
  project_dir: /opt/agrs/Projects/test_project
  data_dir: /opt/agrs/Projects/test_project/data
  output_dir: /opt/agrs/Projects/test_project/outputs/saipem_training
  tensorboard_log: /opt/agrs/Projects/test_project/outputs/saipem_training/tensorboard
  model_save_path: /opt/agrs/Projects/test_project/models/saipem_pirl_v1
  checkpoints_dir: /opt/agrs/Projects/test_project/models/checkpoints
  best_model_dir: /opt/agrs/Projects/test_project/models/best_model
  
# ============================================================================
# DATASETS (Required for SAIPEM Criteria)
# ============================================================================
datasets:
  rasters:
    dem: data/rasters/tinitaly_10m_dem.tif
    slope: data/rasters/slope_percent.tif
    landcover: data/rasters/esa_worldcover_10m.tif
    water_occurrence: data/rasters/global_surface_water.tif
    seismic_hazard: data/rasters/seismic_hazard_pga.tif
    population: data/rasters/worldpop_population.tif
    soil: data/rasters/soilgrids_properties.tif
    
  vectors:
    aoi: data/vectors/aoi.gpkg
    waterways: data/vectors/osm_waterways.gpkg
    roads: data/vectors/osm_roads.gpkg
    railways: data/vectors/osm_railways.gpkg
    power_lines: data/vectors/osm_power.gpkg
    protected_areas: data/vectors/natura2000_sites.gpkg
    admin_boundaries: data/vectors/gadm_admin_boundaries.gpkg
    existing_pipelines: data/vectors/existing_pipelines.gpkg  # For parallelism
    faults: data/vectors/ingv_faults.gpkg  # Geohazards

# ============================================================================
# SUCCESS CRITERIA
# ============================================================================
success_criteria:
  # Primary objective
  cost_savings_target_percent: 10  # Minimum 10% vs baseline
  
  # Constraint satisfaction  
  max_constraint_violations: 0  # Zero violations required
  success_rate_threshold: 0.7  # 70% of episodes reach goal
  
  # Route quality
  max_slope_violations: 0
  clearance_violations: 0
  max_crossings_per_10km: 5  # Target
  
  # Performance
  max_solution_time_minutes: 10

# ============================================================================
# MONITORING & LOGGING
# ============================================================================
monitoring:
  tensorboard_enabled: true
  log_level: INFO
  log_rewards: true
  log_actions: false  # Too verbose
  log_states: false  # Too verbose
  log_episodes: true
  
  # Metrics to track
  track_metrics:
    - episode_reward
    - episode_length
    - success_rate
    - cost_savings_percent
    - constraint_violations
    - crossings_count
    - avg_slope
    - goal_distance_final
    - orthogonality_score
    - parallelism_score

# ============================================================================
# NOTES
# ============================================================================
notes: |
  This configuration implements SAIPEM's 12 routing criteria for cost-optimal,
  industry-compliant pipeline routes. The model is trained using curriculum
  learning from basic navigation to full complexity.
  
  Target: 10%+ cost savings ($10-35M for 100km pipeline)
  Training time: ~24-48 hours on 8-core CPU
  Expected success rate: >70% after full training
  
  All weights and constraints are based on:
  1. SAIPEM AI_Routing_Criteria.xlsx
  2. Comprehensive cost matrix research (11 Perplexity searches)
  3. Industry standards (ASME B31.8, API)
  4. PIRL implementation plan (10 research papers)


