# AGRS - Nginx Configuration (VPS gateway via WireGuard)
# ------------------------------------------------------
# Use this when:
# - DNS points agrsglobal.com/api.agrsglobal.com/zeus.agrsglobal.com to the VPS public IP
# - The VPS proxies traffic over WireGuard to your local machine:
#     - Frontend (marketing) at 10.0.0.2:3000
#     - ZEUS app at 10.0.0.2:3001
#     - API at 10.0.0.2:8000
#
# Place this in: /etc/nginx/sites-available/agrsglobal
# Then:
#   ln -sf /etc/nginx/sites-available/agrsglobal /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# After DNS is in place, issue certs:
#   certbot --nginx -d agrsglobal.com -d www.agrsglobal.com -d api.agrsglobal.com -d zeus.agrsglobal.com
#

# Frontend - agrsglobal.com (marketing website)
server {
    listen 80;
    server_name agrsglobal.com www.agrsglobal.com;

    # Redirect to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # ZEUS migrated from /zeus to zeus.agrsglobal.com (legacy redirect)
    location ~ ^/zeus(?:$|/)(.*)$ {
        return 301 https://zeus.agrsglobal.com/$1$is_args$args;
    }

    # Legacy debug routes -> ZEUS (keep old bookmarks working)
    location ~ ^/(debug|debug-map|test-map)$ {
        return 301 https://zeus.agrsglobal.com$request_uri;
    }

    location / {
        proxy_pass http://10.0.0.2:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# ZEUS Frontend - zeus.agrsglobal.com
server {
    listen 80;
    server_name zeus.agrsglobal.com;

    # Redirect to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://10.0.0.2:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# API Backend - api.agrsglobal.com
server {
    listen 80;
    server_name api.agrsglobal.com;

    # Redirect to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://10.0.0.2:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for real-time updates
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Large file uploads
        client_max_body_size 500M;
    }

    # WebSocket support (if enabled on API)
    location /ws {
        proxy_pass http://10.0.0.2:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
















