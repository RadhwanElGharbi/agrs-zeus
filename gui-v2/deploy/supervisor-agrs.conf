# AGRS ZEUS - Supervisor Configuration
# Place in /etc/supervisor/conf.d/agrs.conf
# Then run: supervisorctl reread && supervisorctl update

[program:agrs-backend]
command=/opt/agrs/gui-v2/backend/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000
directory=/opt/agrs/gui-v2/backend
user=agrs
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/agrs/backend.err.log
stdout_logfile=/var/log/agrs/backend.out.log
environment=HOME="/home/agrs",USER="agrs"

[program:agrs-frontend]
command=/usr/bin/npm run start
directory=/opt/agrs/gui-v2/frontend
user=agrs
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/agrs/frontend.err.log
stdout_logfile=/var/log/agrs/frontend.out.log
environment=HOME="/home/agrs",USER="agrs",NODE_ENV="production",PORT="3000"

[group:agrs]
programs=agrs-backend,agrs-frontend
priority=999
