# AGRS - Nginx Configuration for agrsglobal.com
# Place this in /etc/nginx/sites-available/agrsglobal
# Then: sudo ln -s /etc/nginx/sites-available/agrsglobal /etc/nginx/sites-enabled/

# Frontend - agrsglobal.com
# Website on :3000, ZEUS platform on :3001 (served via zeus.agrsglobal.com)
server {
    listen 80;
    server_name agrsglobal.com www.agrsglobal.com;

    # Redirect to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # ZEUS migrated from /zeus to zeus.agrsglobal.com (legacy redirect)
    # Examples:
    #   /zeus           -> https://zeus.agrsglobal.com/
    #   /zeus/admin     -> https://zeus.agrsglobal.com/admin
    #   /zeus/_next/... -> https://zeus.agrsglobal.com/_next/...
    location ~ ^/zeus(?:$|/)(.*)$ {
        return 301 https://zeus.agrsglobal.com/$1$is_args$args;
    }

    # Legacy debug routes -> ZEUS (redirect to /zeus/debug etc)
    location ~ ^/(debug|debug-map|test-map)$ {
        return 301 https://zeus.agrsglobal.com$request_uri;
    }

    # Marketing website at / -> port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# ZEUS Frontend - zeus.agrsglobal.com
server {
    listen 80;
    server_name zeus.agrsglobal.com;

    # Redirect to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # ZEUS platform -> port 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# API Backend - api.agrsglobal.com
server {
    listen 80;
    server_name api.agrsglobal.com;

    # Redirect to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for real-time updates
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Large file uploads
        client_max_body_size 500M;
    }

    # WebSocket support for Digital Twin
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

